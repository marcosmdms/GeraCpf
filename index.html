<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de CPF para Testes de CRUD</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#111;display:flex;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:560px}
  h1{font-size:28px;margin:0;letter-spacing:-0.02em}
  .sub{color:#6b7280;font-size:14px;margin:8px 0 24px;line-height:1.4}
  .card{border:1px solid #e5e7eb;border-radius:16px;padding:20px}
  .row{display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
  label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
  input[type=number]{width:110px;height:42px;padding:0 12px;border:1px solid #e5e7eb;border-radius:10px;font-size:15px}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;height:42px;cursor:pointer;user-select:none}
  .btn{width:100%;height:48px;background:#111;color:#fff;border:0;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .list{margin-top:16px;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
  .item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-top:1px solid #f3f4f6}
  .item:first-child{border-top:0}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
  .copy{font-size:12px;padding:6px 10px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer}
  .copy:hover{background:#f9fafb}
  .actions{display:flex;gap:8px;margin-top:12px}
  .sec{height:36px;padding:0 14px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;font-size:13px;cursor:pointer}
  .empty{text-align:center;color:#9ca3af;padding:28px;font-size:14px}
  .aviso{color:#9ca3af;font-size:12px;margin-top:20px;line-height:1.4}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gerador de CPF para Testes</h1>
  <p class="sub">CPFs válidos para desenvolvimento. Uso apenas para testes.</p>
  <div class="card">
    <div class="row">
      <div>
        <label for="qtd">Quantidade</label>
        <input id="qtd" type="text" inputmode="numeric" value="10" autocomplete="off">
      </div>
      <label class="check"><input id="mask" type="checkbox" checked> Com máscara</label>
    </div>
    <button id="gerar" class="btn">Gerar CPFs</button>
    <div id="lista" class="list"></div>
    <div class="actions">
      <button id="copyAll" class="sec">Copiar todos</button>
      <button id="clear" class="sec">Limpar</button>
    </div>
    <p class="aviso">Aviso: gerado aleatoriamente para testes. Não use para fraude. 100% local.</p>
  </div>
</div>
<script>
function rnd(n){var a=[];for(var i=0;i<n;i++)a.push(Math.floor(Math.random()*10));return a}
function allSame(a){return a.every(v=>v===a[0])}
function calcDV(b){
  var s=0;for(var i=0;i<9;i++)s+=b[i]*(10-i);var r=s%11;var d1=r<2?0:11-r;
  s=0;for(var i=0;i<9;i++)s+=b[i]*(11-i);s+=d1*2;r=s%11;var d2=r<2?0:11-r;return[d1,d2];
}
function genOne(){var b,d;do{b=rnd(9)}while(allSame(b));d=calcDV(b);var f=b.concat(d);if(allSame(f))return genOne();return f.join('')}
function fmt(c,m){return m?c.slice(0,3)+'.'+c.slice(3,6)+'.'+c.slice(6,9)+'-'+c.slice(9):c}
var cpfs=[],q=document.getElementById('qtd'),mk=document.getElementById('mask'),lista=document.getElementById('lista');
function render(){
  if(!cpfs.length){lista.innerHTML='<div class="empty">Nenhum CPF gerado</div>';return}
  lista.innerHTML=cpfs.map((c,i)=>'<div class="item"><span class="mono">'+fmt(c,mk.checked)+'</span><button class="copy" data-i="'+i+'">copiar</button></div>').join('');
}
function gerar(){
  var raw=(q.value||'').trim();
  var p=raw===''?10:parseInt(raw,10);
  if(isNaN(p)||p<1)p=1;if(p>100)p=100;
  cpfs=[];for(var i=0;i<p;i++)cpfs.push(genOne());render();
}
document.getElementById('gerar').onclick=gerar;
document.getElementById('clear').onclick=function(){cpfs=[];render()};
document.getElementById('copyAll').onclick=function(){
  var t=cpfs.map(c=>fmt(c,mk.checked)).join('\n');if(!t)return;
  navigator.clipboard&&navigator.clipboard.writeText(t);
  var b=document.getElementById('copyAll');var o=b.textContent;b.textContent='Copiado!';setTimeout(()=>b.textContent=o,1200);
};
lista.onclick=function(e){
  var b=e.target.closest('.copy');if(!b)return;
  var v=fmt(cpfs[+b.dataset.i],mk.checked);
  navigator.clipboard&&navigator.clipboard.writeText(v).then(()=>{var o=b.textContent;b.textContent='copiado!';setTimeout(()=>b.textContent=o,1200)});
};
mk.onchange=render;
q.addEventListener('blur',function(){
  var v=(q.value||'').trim();if(v===''){q.value='';return}
  var n=parseInt(v,10);if(isNaN(n)||n<1)q.value='1';else if(n>100)q.value='100';
});
gerar();
</script>
<script>
(() => {
  const FRASES = ["oxe... cê abriu meu código? 🫣","para, tô com vergonha...","não olha, tá todo bagunçado aqui dentro","ah não, F12 de novo? me deixa!","fecha o inspecionar que eu volto ao normal"];
  const css = `#shy-overlay{position:fixed;inset:0;z-index:999999;display:none;place-items:center;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);font-family:system-ui,sans-serif;text-align:center;padding:24px}#shy-overlay.show{display:grid}#shy-overlay.box{background:#111;color:#fff;padding:32px 28px;border-radius:20px;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}#shy-overlay.emoji{font-size:48px;margin-bottom:12px}#shy-overlay h2{margin:0 0 8px;font-size:22px}#shy-overlay p{margin:0;opacity:.8;font-size:14px}body.com-vergonha>:not(#shy-overlay){filter:blur(14px) saturate(.2);pointer-events:none;user-select:none}`;
  const style=document.createElement('style');style.textContent=css;document.documentElement.appendChild(style);
  const overlay=document.createElement('div');overlay.id='shy-overlay';overlay.innerHTML=`<div class="box"><div class="emoji">🫣</div><h2 id="shy-text"></h2><p>fecha o DevTools que eu volto</p></div>`;const textEl=overlay.querySelector('#shy-text');
  function ensure(){if(document.body){document.body.appendChild(overlay);return true}return false}if(!ensure())document.addEventListener('DOMContentLoaded',ensure);
  let isShy=false,frase=0;function setShy(s){if(s===isShy)return;isShy=s;if(!document.body)return;if(s){frase=(frase+1)%FRASES.length;textEl.textContent=FRASES[frase];document.body.classList.add('com-vergonha');overlay.classList.add('show')}else{document.body.classList.remove('com-vergonha');overlay.classList.remove('show')}}
  let open=false;const d=new Image();Object.defineProperty(d,'id',{get(){open=true;return'x'}});setInterval(()=>{open=false;console.log(d);console.clear();const w=window.outerWidth-window.innerWidth>160,h=window.outerHeight-window.innerHeight>160;setShy(open||w||h)},500);
})();
</script>
</body>
</html>
